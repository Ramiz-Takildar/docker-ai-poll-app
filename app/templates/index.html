<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    
    <!-- Responsive viewport settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>AI Poll Voting Application</title>
    
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom inline styles -->
    <style>
        /* Full height container for centered content */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Main container styling */
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 600px;
        }
        
        /* Heading styling */
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 700;
            font-size: 2.5em;
        }
        
        /* Question styling */
        .question {
            font-size: 1.5em;
            color: #555;
            margin-bottom: 40px;
            text-align: center;
            font-weight: 500;
        }
        
        /* Voting buttons styling */
        .btn-vote {
            font-size: 1.3em;
            padding: 15px 40px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Yes button styling */
        .btn-yes {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        
        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        /* No button styling */
        .btn-no {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
        }
        
        .btn-no:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
            color: white;
        }
        
        /* Button container */
        .button-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        /* Results link styling */
        .results-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .results-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: color 0.3s ease;
        }
        
        .results-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        /* Success message styling */
        .alert-success {
            margin-top: 20px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }
        
        /* Loading spinner styling */
        .spinner-border {
            color: #667eea;
        }
        
        /* Animation for messages */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Application header -->
        <h1>🤖 AI Poll</h1>
        
        <!-- Poll question -->
        <div class="question">
            Is AI Dangerous?
        </div>
        
        <!-- Voting buttons -->
        <div class="button-container">
            <!-- Yes button -->
            <button 
                class="btn btn-vote btn-yes" 
                onclick="submitVote('yes')"
                id="yesBtn"
            >
                Yes
            </button>
            
            <!-- No button -->
            <button 
                class="btn btn-vote btn-no" 
                onclick="submitVote('no')"
                id="noBtn"
            >
                No
            </button>
        </div>
        
        <!-- Message container for feedback -->
        <div id="messageContainer"></div>
        
        <!-- Link to results page -->
        <div class="results-link">
            <a href="/results">View Live Results →</a>
        </div>
    </div>

    <!-- Bootstrap JS for functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript for voting logic -->
    <script>
        /**
         * Submit vote to backend
         * @param {string} option - Vote option ('yes' or 'no')
         */
        function submitVote(option) {
            // Disable buttons to prevent multiple clicks
            document.getElementById('yesBtn').disabled = true;
            document.getElementById('noBtn').disabled = true;
            
            // Clear previous messages
            document.getElementById('messageContainer').innerHTML = '';
            
            // Show loading indicator
            const messageDiv = document.getElementById('messageContainer');
            messageDiv.innerHTML = `
                <div class="alert alert-info">
                    <div class="spinner-border spinner-border-sm me-2"></div>
                    Recording your vote...
                </div>
            `;
            
            // Send vote to backend API
            fetch('/vote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ option: option })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Show success message
                    messageDiv.innerHTML = `
                        <div class="alert alert-success">
                            ✓ Your vote has been recorded!
                        </div>
                    `;
                    
                    // Re-enable buttons after 2 seconds
                    setTimeout(() => {
                        document.getElementById('yesBtn').disabled = false;
                        document.getElementById('noBtn').disabled = false;
                    }, 2000);
                } else {
                    // Show error message
                    messageDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ✗ Error: ${data.message}
                        </div>
                    `;
                    
                    // Re-enable buttons
                    document.getElementById('yesBtn').disabled = false;
                    document.getElementById('noBtn').disabled = false;
                }
            })
            .catch(error => {
                // Show network error
                messageDiv.innerHTML = `
                    <div class="alert alert-danger">
                        ✗ Network error: ${error.message}
                    </div>
                `;
                
                // Re-enable buttons
                document.getElementById('yesBtn').disabled = false;
                document.getElementById('noBtn').disabled = false;
            });
        }
    </script>
</body>
</html>
